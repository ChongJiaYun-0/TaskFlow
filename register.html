<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow · Create account</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Boxicons -->
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <style>
    /* ============================================================
       DESIGN TOKENS — exactly matching index.html
       ============================================================ */
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-2: #f9fafc;
      --text: #18212f;
      --muted: #6f7b8d;
      --border: #e6e9ef;
      --primary: #5865f2;
      --primary-dark: #4750d1;
      --primary-soft: #eef0ff;
      --green: #20a66a;
      --green-soft: #eaf8f1;
      --blue: #3b82f6;
      --blue-soft: #eaf2ff;
      --amber: #d99118;
      --amber-soft: #fff5df;
      --red: #e45454;
      --red-soft: #fff0f0;
      --radius: 14px;
      --shadow: 0 10px 30px rgba(25, 35, 55, .07);
      --shadow-lg: 0 25px 60px rgba(25, 35, 55, .12);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg: #10141b;
      --surface: #171d27;
      --surface-2: #1c2330;
      --text: #edf1f7;
      --muted: #96a1b2;
      --border: #293241;
      --primary: #7b86ff;
      --primary-dark: #6871e0;
      --primary-soft: #252b55;
      --green: #41c98b;
      --green-soft: #17382b;
      --blue: #69a0ff;
      --blue-soft: #192e50;
      --amber: #f1b74d;
      --amber-soft: #3d301a;
      --red: #ff7777;
      --red-soft: #3c2225;
      --shadow: 0 12px 35px rgba(0, 0, 0, .28);
      --shadow-lg: 0 25px 60px rgba(0, 0, 0, .45);
    }

    /* ============================================================
       RESET
       ============================================================ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      line-height: 1.6;
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 0;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: 0; background: transparent; color: inherit; }
    img, svg { max-width: 100%; display: block; }

    /* ============================================================
       FLOATING BACKGROUND ORBS
       ============================================================ */
    .orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(60px);
      opacity: 0.35;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: var(--primary);
      top: -180px;
      right: -150px;
      animation: float 22s ease-in-out infinite;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: var(--blue);
      bottom: -120px;
      left: -150px;
      animation: float 26s ease-in-out infinite reverse;
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      background: var(--amber);
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.15;
      animation: float 30s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(40px, -30px) scale(1.08); }
      66%      { transform: translate(-30px, 40px) scale(0.95); }
    }

    /* ============================================================
       AUTH CARD
       ============================================================ */
    .auth-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      padding: 24px;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 36px 32px 32px;
      box-shadow: var(--shadow-lg);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .auth-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 30px 70px rgba(25, 35, 55, .15);
    }

    /* Logo header */
    .auth-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-logo .brand-mark {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: var(--primary);
      color: #fff;
      display: inline-grid;
      place-items: center;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-weight: 800;
      font-size: 24px;
      box-shadow: 0 10px 22px rgba(88, 101, 242, .25);
      margin-bottom: 12px;
    }

    .auth-logo h1 {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .auth-logo h1 span {
      color: var(--primary);
    }

    .auth-logo p {
      font-size: 14px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Status message */
    .auth-status {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 18px;
      border: 1px solid transparent;
      line-height: 1.5;
    }

    .auth-status.show { display: block; }

    .auth-status.error {
      background: var(--red-soft);
      color: var(--red);
      border-color: rgba(228, 84, 84, .2);
    }

    .auth-status.success {
      background: var(--green-soft);
      color: var(--green);
      border-color: rgba(32, 166, 106, .2);
    }

    .auth-status.info {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: rgba(88, 101, 242, .15);
    }

    /* Form */
    .form-group { margin-bottom: 18px; }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      font-size: 16px;
      color: var(--muted);
      pointer-events: none;
      transition: color var(--transition);
      z-index: 1;
    }

    .input-wrapper input {
      width: 100%;
      padding: 13px 16px 13px 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      background: var(--surface-2);
      color: var(--text);
      transition: all var(--transition);
      outline: none;
    }

    .input-wrapper input:focus {
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(88, 101, 242, .12);
    }

    .input-wrapper input:focus + i,
    .input-wrapper input:focus ~ i {
      color: var(--primary);
    }

    .input-wrapper input::placeholder {
      color: var(--muted);
      opacity: 0.7;
    }

    .input-wrapper input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Password toggle */
    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      font-size: 16px;
      opacity: 0.6;
      transition: all var(--transition);
      z-index: 2;
      display: grid;
      place-items: center;
    }

    .toggle-password:hover {
      color: var(--text);
      opacity: 1;
    }

    .password-wrapper input {
      padding-right: 46px;
    }

    /* Password strength */
    .strength-meter {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      padding: 0 2px;
    }

    .strength-meter .bar {
      height: 4px;
      flex: 1;
      border-radius: 4px;
      background: var(--border);
      transition: background 0.2s;
    }

    .strength-meter .bar.weak { background: var(--red); }
    .strength-meter .bar.fair { background: var(--amber); }
    .strength-meter .bar.good { background: var(--blue); }
    .strength-meter .bar.strong { background: var(--green); }

    .field-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .field-hint i { font-size: 11px; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: all var(--transition);
      cursor: pointer;
      white-space: nowrap;
      width: 100%;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 6px 18px rgba(88, 101, 242, .25);
      margin-top: 4px;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(88, 101, 242, .35);
    }

    .btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border);
      color: var(--muted);
      margin-top: 12px;
    }

    .btn-outline:hover {
      background: var(--surface-2);
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-1px);
    }

    .btn i { font-size: 16px; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Auth footer */
    .auth-footer {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .auth-footer a {
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      transition: color var(--transition);
    }

    .auth-footer a:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    /* Theme toggle floating */
    .theme-toggle-float {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: all var(--transition);
    }

    .theme-toggle-float:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: scale(1.05);
    }

    /* Back to home link */
    .back-home {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: all var(--transition);
    }

    .back-home:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateX(-2px);
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 480px) {
      body { padding: 16px 0; }
      .auth-container { padding: 16px; }
      .auth-card { padding: 28px 22px 24px; border-radius: 18px; }
      .auth-logo .brand-mark { width: 46px; height: 46px; font-size: 21px; }
      .auth-logo h1 { font-size: 22px; }
      .back-home { top: 14px; left: 14px; padding: 6px 10px; font-size: 11px; }
      .theme-toggle-float { top: 14px; right: 14px; width: 36px; height: 36px; font-size: 18px; }
    }
  </style>
</head>
<body>

  <!-- ============ FLOATING BACKGROUND ORBS ============ -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- ============ BACK TO HOME ============ -->
  <a href="index.html" class="back-home">
    <i class="bx bx-arrow-back"></i> Back to home
  </a>

  <!-- ============ THEME TOGGLE ============ -->
  <button class="theme-toggle-float" id="themeToggle" title="Toggle theme">
    <i class="bx bx-moon" id="themeIcon"></i>
  </button>

  <!-- ============ AUTH CARD ============ -->
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="brand-mark">T</div>
        <h1>Task<span>Flow</span></h1>
        <p>Create your free account</p>
      </div>

      <div class="auth-status" id="authStatus"></div>

      <form id="registerForm" autocomplete="off">
        <!-- Full name -->
        <div class="form-group">
          <label for="fullName">Full name</label>
          <div class="input-wrapper">
            <i class="fas fa-user"></i>
            <input type="text" id="fullName" placeholder="Alex Rivera" required autocomplete="name" />
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper password-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Create a strong password" required autocomplete="new-password" minlength="6" />
          </div>
          <div class="strength-meter" id="strengthMeter">
            <span class="bar" id="bar1"></span>
            <span class="bar" id="bar2"></span>
            <span class="bar" id="bar3"></span>
            <span class="bar" id="bar4"></span>
          </div>
          <div class="field-hint">
            <i class="fas fa-info-circle"></i> Use 6+ characters with a mix of letters, numbers & symbols.
          </div>
        </div>

        <!-- Confirm password -->
        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <div class="input-wrapper password-wrapper">
            <i class="fas fa-check-circle"></i>
            <input type="password" id="confirmPassword" placeholder="Re-enter your password" required autocomplete="new-password" />
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary" id="submitBtn">
          <span id="submitText">Create account</span>
          <i class="fas fa-arrow-right" id="submitIcon"></i>
        </button>
      </form>

      <!-- Back to login button -->
      <a href="login.html" class="btn btn-outline" id="backToLogin">
        <i class="fas fa-arrow-left"></i> Back to login
      </a>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <!-- ============ SUPABASE ============ -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
  (function() {
    'use strict';

    // =====================================================
    // CONFIGURATION
    // =====================================================
    const SUPABASE_URL = "https://vjtxicimwuovikifkwyb.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_GKDi350FTcPpHWwXfMapTw_hk2-8qaH";

    // =====================================================
    // INIT SUPABASE
    // =====================================================
    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      {
        auth: {
          persistSession: true,
          storageKey: 'supabase-auth',
          storage: window.localStorage,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    // =====================================================
    // DOM REFS
    // =====================================================
    const fullNameInput = document.getElementById('fullName');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const registerForm = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');
    const submitText = document.getElementById('submitText');
    const submitIcon = document.getElementById('submitIcon');
    const authStatus = document.getElementById('authStatus');

    // strength bars
    const bars = [
      document.getElementById('bar1'),
      document.getElementById('bar2'),
      document.getElementById('bar3'),
      document.getElementById('bar4')
    ];

    // =====================================================
    // THEME
    // =====================================================
    const THEME_KEY = 'taskflow.theme';
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        if (themeIcon) themeIcon.className = 'bx bx-sun';
      } else {
        document.documentElement.removeAttribute('data-theme');
        if (themeIcon) themeIcon.className = 'bx bx-moon';
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    }

    // =====================================================
    // UTILITIES
    // =====================================================
    function showStatus(message, type = 'info') {
      authStatus.textContent = message;
      authStatus.className = 'auth-status show ' + type;
    }

    function hideStatus() {
      authStatus.className = 'auth-status';
    }

    function setLoading(isLoading) {
      if (isLoading) {
        submitBtn.disabled = true;
        submitText.innerHTML = '<span class="spinner"></span> Creating...';
        submitIcon.style.display = 'none';
      } else {
        submitBtn.disabled = false;
        submitText.textContent = 'Create account';
        submitIcon.style.display = 'inline';
      }
    }

    // =====================================================
    // PASSWORD STRENGTH
    // =====================================================
    function evaluatePasswordStrength(pwd) {
      if (!pwd) return 0;
      let score = 0;
      if (pwd.length >= 6) score++;
      if (pwd.length >= 10) score++;
      if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
      if (/\d/.test(pwd)) score++;
      if (/[^A-Za-z0-9]/.test(pwd)) score++;
      return Math.min(score, 4);
    }

    passwordInput.addEventListener('input', function() {
      const pwd = this.value;
      const strength = evaluatePasswordStrength(pwd);
      const classes = ['weak', 'fair', 'good', 'strong'];
      bars.forEach(bar => bar.className = 'bar');
      for (let i = 0; i < strength; i++) {
        bars[i].classList.add(classes[strength - 1] || 'weak');
      }
      if (pwd && strength === 0) bars[0].classList.add('weak');
    });

    // =====================================================
    // CHECK EXISTING SESSION
    // =====================================================
    async function checkExistingSession() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          showStatus('✅ Already signed in. Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1200);
          return true;
        }
      } catch (err) {
        console.error('Session check error:', err);
      }
      return false;
    }

    // =====================================================
    // REGISTER HANDLER
    // =====================================================
    async function handleRegister(e) {
      e.preventDefault();
      hideStatus();

      const fullName = fullNameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      const confirmPassword = confirmPasswordInput.value.trim();

      if (!fullName || !email || !password || !confirmPassword) {
        showStatus('⚠️ Please fill in all fields.', 'error');
        return;
      }
      if (fullName.length < 2) {
        showStatus('⚠️ Please enter your full name.', 'error');
        return;
      }
      if (!email.includes('@') || !email.includes('.')) {
        showStatus('⚠️ Please enter a valid email address.', 'error');
        return;
      }
      if (password.length < 6) {
        showStatus('⚠️ Password must be at least 6 characters.', 'error');
        return;
      }
      if (password !== confirmPassword) {
        showStatus('⚠️ Passwords do not match.', 'error');
        return;
      }

      setLoading(true);

      try {
        // Check for duplicate email
        const { data: existingEmail } = await supabaseClient
          .from('profiles')
          .select('id')
          .eq('email', email)
          .maybeSingle();

        if (existingEmail) {
          showStatus('❌ This email is already registered. Try signing in.', 'error');
          setLoading(false);
          return;
        }

        // Sign up
        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              full_name: fullName,
              display_name: fullName,
            },
            emailRedirectTo: null
          }
        });

        if (error) {
          if (error.message.includes('already registered')) {
            showStatus('❌ This email is already registered. Try signing in.', 'error');
          } else {
            showStatus('❌ ' + error.message, 'error');
          }
          setLoading(false);
          return;
        }

        // Ensure profile row is created
        if (data?.user?.id) {
          await supabaseClient.from('profiles').upsert({
            id: data.user.id,
            full_name: fullName,
            email: email
          }, { onConflict: 'id' });
        }

        if (data?.session) {
          showStatus('✅ Account created! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1500);
        } else {
          showStatus('✅ Account created! You can now sign in.', 'success');
          setLoading(false);
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        }

      } catch (err) {
        console.error('Registration error:', err);
        showStatus('❌ Network error. Please try again.', 'error');
        setLoading(false);
      }
    }

    // =====================================================
    // KEYBOARD SHORTCUTS
    // =====================================================
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        registerForm.dispatchEvent(new Event('submit'));
      }
      if (e.key === 'Escape') {
        hideStatus();
        document.activeElement?.blur();
      }
    });

    // =====================================================
    // INIT
    // =====================================================
    async function init() {
      // Apply saved theme
      const savedTheme = localStorage.getItem(THEME_KEY);
      if (savedTheme) {
        applyTheme(savedTheme);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        applyTheme('dark');
      }

      // Theme toggle
      themeToggle?.addEventListener('click', toggleTheme);

      // Form submit
      registerForm.addEventListener('submit', handleRegister);

      // Check session
      const hasSession = await checkExistingSession();
      if (hasSession) return;

      // Focus name
      fullNameInput.focus();

      console.log('✅ TaskFlow Register Page Initialized');
      console.log('🔌 Connected to Supabase:', SUPABASE_URL);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  })();
</script>

</body>
</html>
