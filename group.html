<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Group Tasks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Group page styles */
        .toolbar {
            display: flex;
            gap: 9px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .search-box {
            display: flex;
            align-items: center;
            gap: 7px;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 10px;
            padding: 0 10px;
            height: 38px;
            min-width: 220px;
            flex: 1;
        }
        .search-box input {
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            width: 100%;
            font-size: 11px;
        }
        .select {
            height: 38px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            border-radius: 10px;
            padding: 0 10px;
            font-size: 11px;
            min-width: 120px;
        }
        #clearGroupFilters {
            width: auto;
            flex: 0 0 auto;
            height: 38px;
        }
        .select option[value="pending"],
        .select.status-pending {color: #d97706; }
        .select option[value="in-progress"],
        .select.status-in-progress { color: #2563eb; }
        .select option[value="completed"],
        .select.status-completed { color: #16a34a; }
        .select option[value="overdue"],
        .select.status-overdue { color: #64748b; }
        .select option[value="high"],
        .select.priority-high { color: #dc2626; }
        .select option[value="medium"],
        .select.priority-medium { color: #d97706; }
        .select option[value="low"],
        .select.priority-low { color: #16a34a; }
        .select.status-pending,
        .select.status-in-progress,
        .select.status-completed,
        .select.status-overdue,
        .select.priority-high,
        .select.priority-medium,
        .select.priority-low { font-weight: 600; }
        .task-table-wrap {
            overflow: auto;
        }
        .task-table {
            width: 100%;
            border-collapse: collapse;
        }
        .task-table th {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--muted);
            text-align: left;
            padding: 11px 12px;
            border-bottom: 1px solid var(--border);
        }
        .task-table td {
            padding: 13px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            vertical-align: middle;
        }
        .task-table tr:hover td {
            background: var(--surface-2);
        }
        .task-table tr.locked-row {
            opacity: 0.7;
        }
        .task-table tr.locked-row .task-title {
            text-decoration: line-through;
        }
        .row-actions {
            display: flex;
            gap: 2px;
        }
        .row-actions button {
            border: 0;
            background: transparent;
            color: var(--muted);
            width: 26px;
            height: 26px;
            border-radius: 7px;
            transition: all var(--transition);
            font-size: 14px;
        }
        .row-actions button:hover {
            background: var(--surface-2);
            color: var(--text);
            transform: scale(1.1);
        }
        .row-actions button.check,
        .row-actions button.check:hover,
        .task-table button.check,
        .task-table button.check:hover {
            width: 28px;
            height: 28px;
            min-width: 28px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--green);
            font-size: 14px;
            transform: none;
        }
        .row-actions button.check:hover,
        .task-table button.check:hover {
            border-color: var(--green);
            background: var(--green-soft);
        }
        .row-actions button.check.completed,
        .row-actions button.check.completed:hover,
        .task-table button.check.completed,
        .task-table button.check.completed:hover {
            border-color: var(--green);
            background: var(--green);
            color: #fff;
        }
        .row-actions button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .task-title {
            font-weight: 600;
            font-size: 12px;
        }
        .task-desc-preview {
            font-size: 10px;
            color: var(--muted);
            margin-top: 2px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 3px 7px;
            font-size: 9px;
            font-weight: 700;
        }
        .badge.high {
            color: var(--red);
            background: var(--red-soft);
        }
        .badge.medium {
            color: var(--amber);
            background: var(--amber-soft);
        }
        .badge.low {
            color: var(--green);
            background: var(--green-soft);
        }
        .badge.completed {
            color: var(--green);
            background: var(--green-soft);
        }
        .badge.inprogress {
            color: var(--blue);
            background: var(--blue-soft);
        }
        .badge.pending {
            color: var(--amber);
            background: var(--amber-soft);
        }
        .badge.overdue {
            color: var(--muted);
            background: var(--surface-2);
        }
        .check {
            width: 20px;
            height: 20px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            display: grid;
            place-items: center;
            color: var(--green);
            font-size: 11px;
            transition: all var(--transition);
            cursor: pointer;
        }
        .check:hover {
            border-color: var(--green);
            background: var(--green-soft);
        }
        .check.completed {
            background: var(--green);
            border-color: var(--green);
            color: #fff;
        }
        .Group-board {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            padding: 16px;
        }
        .board-col h4 {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--muted);
            margin: 0 0 8px;
        }
        .task-card {
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            margin-bottom: 8px;
            transition: all var(--transition);
            cursor: pointer;
        }
        .task-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow);
        }
        .task-card.locked-row {
            opacity: 0.7;
        }
        .task-card .project-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .task-card p {
            font-size: 11px;
            color: var(--muted);
            margin: 4px 0 8px;
            line-height: 1.4;
        }
        .task-card .task-meta {
            font-size: 10px;
            color: var(--muted);
        }
        .group-subtasks {
            display: grid;
            gap: 4px;
            margin-top: 9px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }
        .group-card-subtasks {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .subtask-section-label {
            display: block;
            margin-bottom: 7px;
            color: var(--muted);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        .group-subtask-cards {
            display: grid;
            gap: 6px;
        }
        .group-subtask-card {
            position: relative;
            display: grid;
            gap: 6px;
            padding: 9px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface-2);
        }
        .group-subtask-card-main {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
        }
        .group-subtask-card-main strong {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 10px;
        }
        .group-subtask-card.completed .group-subtask-card-main strong {
            color: var(--muted);
            text-decoration: line-through;
        }
        .group-subtask-card-meta {
            display: flex;
            align-items: center;
            gap: 7px;
            padding-left: 27px;
            color: var(--muted);
            font-size: 9px;
        }
        .subtask-check {
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            width: 20px;
            height: 20px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: transparent;
            font-size: 12px;
        }
        .subtask-check:hover {
            border-color: var(--green);
            background: var(--green-soft);
            color: var(--green);
        }
        .subtask-check.completed {
            border-color: var(--green);
            background: var(--green);
            color: #fff;
        }
        .subtask-attachment-button {
            position: absolute;
            right: 7px;
            bottom: 7px;
            width: 22px;
            height: 22px;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--muted);
        }
        .subtask-attachment-button:hover {
            color: var(--primary);
        }
        .subtask-empty {
            color: var(--muted);
            font-size: 10px;
        }
        .attachment-chip {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            max-width: 150px;
            overflow: hidden;
            color: var(--primary);
            font-size: 9px;
            text-decoration: none;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .attachment-chip:hover {
            text-decoration: underline;
        }
        .group-subtask {
            display: grid;
            grid-template-columns: 14px minmax(0, 1fr) auto;
            align-items: center;
            gap: 5px;
            color: var(--muted);
            font-size: 10px;
        }
        .group-subtask i {
            color: var(--primary);
            font-size: 13px;
        }
        .group-subtask span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .group-subtask small {
            color: var(--muted);
            font-size: 9px;
        }
        .group-subtask.completed span {
            text-decoration: line-through;
            opacity: .65;
        }
        .group-comments-backdrop {
            position: fixed;
            inset: 0;
            z-index: 70;
            background: rgba(8, 12, 20, .42);
        }
        .group-comments-panel {
            position: fixed;
            z-index: 71;
            top: 50%;
            left: 50%;
            width: min(520px, calc(100% - 32px));
            max-height: min(620px, calc(100vh - 32px));
            overflow: auto;
            transform: translate(-50%, -50%);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: 0 25px 70px rgba(0, 0, 0, .22);
        }
        .group-comments-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
        }
        .group-comments-head h3 {
            margin: 5px 0 0;
            font-size: 16px;
        }
        .group-comments-list {
            max-height: 360px;
            overflow-y: auto;
            padding: 8px 20px;
        }
        .comment-avatar-wrap {
            position: relative;
            flex: 0 0 auto;
            cursor: help;
        }
        .comment-avatar-wrap::after {
            content: attr(data-email);
            position: absolute;
            z-index: 2;
            left: 0;
            bottom: calc(100% + 7px);
            width: max-content;
            max-width: 220px;
            padding: 6px 8px;
            border-radius: 6px;
            background: var(--text);
            color: var(--surface);
            font-size: 10px;
            line-height: 1.2;
            opacity: 0;
            pointer-events: none;
            transform: translateY(3px);
            transition: opacity .15s ease, transform .15s ease;
        }
        .comment-avatar-wrap:hover::after,
        .comment-avatar-wrap:focus-within::after {
            opacity: 1;
            transform: translateY(0);
        }
        .comment-attachment {
            display: block;
            width: min(260px, 100%);
            max-height: 180px;
            margin: 8px 0 6px;
            object-fit: cover;
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        .group-comment-form {
            padding: 14px 20px 18px;
            border-top: 1px solid var(--border);
        }
        .group-comment-form select {
            min-width: 150px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--surface-2);
            color: var(--text);
            padding: 0 8px;
            font-size: 10px;
        }
        .comment-attachment-button {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            width: 38px;
            height: 38px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--surface-2);
            color: var(--muted);
            font-size: 15px;
            cursor: pointer;
            transition: all var(--transition);
        }
        .comment-attachment-button:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: var(--primary);
        }
        .comment-attachment-button.has-files {
            border-color: var(--primary);
            color: var(--primary);
        }
        .comment-attachment-button input[type="file"] {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        .comment-attachment-button .attach-count {
            display: none;
            position: absolute;
            top: -6px;
            right: -6px;
            min-width: 15px;
            height: 15px;
            padding: 0 3px;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: var(--primary);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            line-height: 1;
        }
        .comment-attachment-button.has-files .attach-count {
            display: flex;
        }
        .comment-email {
            display: block;
            width: fit-content;
            margin-top: 2px;
            color: var(--primary);
            font-size: 10px;
            text-decoration: none;
        }
        .comment-email:hover {
            text-decoration: underline;
        }
        .group-comment-form .btn {
            flex: 0 0 auto;
            width: 42px;
            padding: 0;
        }
        @media (max-width: 560px) {
            .group-comment-form {
                flex-wrap: wrap;
            }
            .group-comment-form input,
            .group-comment-form select {
                flex: 1 1 100%;
                min-height: 38px;
            }
            .group-comment-form .btn {
                margin-left: auto;
                height: 38px;
            }
        }
        .group-timeline {
            display: grid;
            gap: 1px;
            padding: 18px;
            overflow-x: auto;
            background: var(--surface);
        }
        .group-timeline-scale,
        .group-timeline-row {
            display: grid;
            grid-template-columns: minmax(220px, 28%) minmax(420px, 1fr) auto;
            gap: 14px;
            min-width: 650px;
        }
        .group-timeline-scale {
            color: var(--muted);
            font-size: 10px;
            padding: 0 0 8px;
        }
        .group-timeline-scale span:first-child {
            grid-column: 2;
        }
        .group-timeline-scale span:last-child {
            text-align: right;
        }
        .group-timeline-row {
            align-items: center;
            min-height: 54px;
            border-top: 1px solid var(--border);
        }
        .group-timeline-row[data-view] {
            cursor: pointer;
        }
        .group-timeline-label {
            display: grid;
            gap: 3px;
            min-width: 0;
        }
        .group-timeline-label strong {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 11px;
        }
        .group-timeline-label span {
            color: var(--muted);
            font-size: 9px;
        }
        .group-timeline-track {
            position: relative;
            height: 24px;
            border-radius: 6px;
            background: repeating-linear-gradient(90deg, var(--surface-2) 0, var(--surface-2) calc(20% - 1px), var(--border) 20%);
        }
        .group-timeline-bar {
            position: absolute;
            top: 5px;
            height: 14px;
            min-width: 8px;
            border-radius: 7px;
            background: var(--primary);
            box-shadow: 0 2px 6px rgba(88, 101, 242, .2);
        }
        .group-timeline-bar.pending { background: var(--amber); }
        .group-timeline-bar.in-progress { background: var(--blue); }
        .group-timeline-bar.completed { background: var(--green); }
        .group-timeline-bar.overdue { background: var(--muted); }
        .timeline-actions {
            opacity: 0;
            transition: opacity .2s ease;
        }
        .group-timeline-row:hover .timeline-actions,
        .group-timeline-row:focus-within .timeline-actions {
            opacity: 1;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-box {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .15);
        }
        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .modal-head h3 {
            font-family: "Plus Jakarta Sans";
            font-size: 18px;
        }
        .modal-body label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            margin-top: 12px;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }
        .modal-body input,
        .modal-body textarea,
        .modal-body select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface-2);
            color: var(--text);
            font-size: 13px;
            transition: all 0.2s;
            outline: none;
        }
        .modal-body input:focus,
        .modal-body textarea:focus,
        .modal-body select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }
        .modal-body .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .modal-body .form-error {
            color: var(--red);
            font-size: 12px;
            margin-top: 8px;
            min-height: 20px;
        }
        .modal-foot {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .btn {
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            border-radius: 10px;
            padding: 9px 13px;
            font-weight: 600;
            font-size: 12px;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: var(--primary);
            transform: translateY(-1px);
        }
        .btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        .btn.primary:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            opacity: 0.9;
        }
        .btn.secondary {
            background: var(--surface-2);
        }
        .btn.secondary:hover {
            background: var(--surface-2);
            border-color: var(--primary);
            color: var(--primary);
        }
        .btn.danger {
            background: var(--red);
            border-color: var(--red);
            color: #fff;
        }
        .btn.danger:hover {
            background: var(--red);
            border-color: var(--red);
            color: #fff;
            opacity: 0.9;
        }
        .drawer {
            position: fixed;
            right: -500px;
            top: 0;
            height: 100vh;
            width: 480px;
            max-width: 100%;
            background: var(--surface);
            z-index: 60;
            box-shadow: -15px 0 45px rgba(0, 0, 0, .15);
            transition: right .25s;
            overflow: auto;
            border-left: 1px solid var(--border);
        }
        .drawer.open {
            right: 0;
        }
        .drawer-head {
            padding: 22px 22px 17px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .drawer-head .eyebrow {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--primary);
            font-weight: 700;
        }
        .drawer-head h2 {
            margin: 4px 0 0;
            font-family: "Plus Jakarta Sans";
            font-size: 20px;
        }
        .drawer-body {
            padding: 20px;
        }
        .detail-section {
            padding: 18px 0;
            border-bottom: 1px solid var(--border);
        }
        .detail-section:last-child {
            border-bottom: none;
        }
        .detail-section h4 {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--muted);
            margin: 0 0 10px;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .detail-label {
            font-size: 9px;
            color: var(--muted);
            display: block;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }
        .detail-value {
            font-size: 12px;
            font-weight: 500;
        }
        .detail-description {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text);
        }
        .locked {
            color: var(--muted);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .empty {
            padding: 45px 20px;
            text-align: center;
            color: var(--muted);
        }
        .empty .empty-icon {
            font-size: 28px;
            margin-bottom: 9px;
        }
        .empty h3 {
            color: var(--text);
            font-size: 14px;
            margin: 0 0 5px;
        }
        .empty p {
            font-size: 11px;
            margin: 0 0 14px;
        }
        .page-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 24px;
        }
        .page-head h2 {
            font-family: "Plus Jakarta Sans";
            font-size: 26px;
            margin: 0 0 6px;
        }
        .page-head p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }
        .page-actions {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 18px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .stat-card .stat-number {
            font-family: "Plus Jakarta Sans";
            font-size: 24px;
            font-weight: 800;
            margin: 4px 0;
        }
        .stat-card .stat-label {
            font-size: 11px;
            color: var(--muted);
        }
        .segmented {
            display: flex;
            background: var(--surface-2);
            padding: 3px;
            border-radius: 9px;
        }
        .segmented button {
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 10px;
            padding: 6px 9px;
            border-radius: 7px;
            transition: all var(--transition);
        }
        .segmented button:hover {
            color: var(--text);
            background: var(--surface);
        }
        .segmented button.active {
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
        }
        @media (max-width: 768px) {
            .stats {
                grid-template-columns: 1fr 1fr;
            }
            .modal-box {
                margin: 10px;
                padding: 16px;
            }
            .modal-body .modal-grid {
                grid-template-columns: 1fr;
            }
            .drawer {
                width: 100%;
            }
            .page-head {
                flex-direction: column;
                align-items: flex-start;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .search-box {
                min-width: unset;
            }
            .Group-board {
                grid-template-columns: 1fr;
            }
            .detail-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
