<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow · Sign in</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Boxicons -->
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <style>
    /* ============================================================
       DESIGN TOKENS — exactly matching index.html
       ============================================================ */
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-2: #f9fafc;
      --text: #18212f;
      --muted: #6f7b8d;
      --border: #e6e9ef;
      --primary: #5865f2;
      --primary-dark: #4750d1;
      --primary-soft: #eef0ff;
      --green: #20a66a;
      --green-soft: #eaf8f1;
      --blue: #3b82f6;
      --blue-soft: #eaf2ff;
      --amber: #d99118;
      --amber-soft: #fff5df;
      --red: #e45454;
      --red-soft: #fff0f0;
      --radius: 14px;
      --shadow: 0 10px 30px rgba(25, 35, 55, .07);
      --shadow-lg: 0 25px 60px rgba(25, 35, 55, .12);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg: #10141b;
      --surface: #171d27;
      --surface-2: #1c2330;
      --text: #edf1f7;
      --muted: #96a1b2;
      --border: #293241;
      --primary: #7b86ff;
      --primary-dark: #6871e0;
      --primary-soft: #252b55;
      --green: #41c98b;
      --green-soft: #17382b;
      --blue: #69a0ff;
      --blue-soft: #192e50;
      --amber: #f1b74d;
      --amber-soft: #3d301a;
      --red: #ff7777;
      --red-soft: #3c2225;
      --shadow: 0 12px 35px rgba(0, 0, 0, .28);
      --shadow-lg: 0 25px 60px rgba(0, 0, 0, .45);
    }

    /* ============================================================
       RESET
       ============================================================ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      line-height: 1.6;
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: 0; background: transparent; color: inherit; }
    img, svg { max-width: 100%; display: block; }

    /* ============================================================
       FLOATING BACKGROUND ORBS
       ============================================================ */
    .orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(60px);
      opacity: 0.35;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: var(--primary);
      top: -180px;
      right: -150px;
      animation: float 22s ease-in-out infinite;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: var(--blue);
      bottom: -120px;
      left: -150px;
      animation: float 26s ease-in-out infinite reverse;
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      background: var(--amber);
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.15;
      animation: float 30s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(40px, -30px) scale(1.08); }
      66%      { transform: translate(-30px, 40px) scale(0.95); }
    }

    /* ============================================================
       AUTH CARD
       ============================================================ */
    .auth-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      padding: 24px;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 36px 32px 32px;
      box-shadow: var(--shadow-lg);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .auth-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 30px 70px rgba(25, 35, 55, .15);
    }

    /* Logo header */
    .auth-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-logo .brand-mark {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: var(--primary);
      color: #fff;
      display: inline-grid;
      place-items: center;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-weight: 800;
      font-size: 24px;
      box-shadow: 0 10px 22px rgba(88, 101, 242, .25);
      margin-bottom: 12px;
    }

    .auth-logo h1 {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .auth-logo h1 span {
      color: var(--primary);
    }

    .auth-logo p {
      font-size: 14px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Status message */
    .auth-status {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 18px;
      border: 1px solid transparent;
      line-height: 1.5;
    }

    .auth-status.show { display: block; }

    .auth-status.error {
      background: var(--red-soft);
      color: var(--red);
      border-color: rgba(228, 84, 84, .2);
    }

    .auth-status.success {
      background: var(--green-soft);
      color: var(--green);
      border-color: rgba(32, 166, 106, .2);
    }

    .auth-status.info {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: rgba(88, 101, 242, .15);
    }

    /* Form */
    .form-group { margin-bottom: 18px; }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      font-size: 16px;
      color: var(--muted);
      pointer-events: none;
      transition: color var(--transition);
      z-index: 1;
    }

    .input-wrapper input {
      width: 100%;
      padding: 13px 16px 13px 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      background: var(--surface-2);
      color: var(--text);
      transition: all var(--transition);
      outline: none;
    }

    .input-wrapper input:focus {
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(88, 101, 242, .12);
    }

    .input-wrapper input:focus + i,
    .input-wrapper input:focus ~ i {
      color: var(--primary);
    }

    .input-wrapper input::placeholder {
      color: var(--muted);
      opacity: 0.7;
    }

    .input-wrapper input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Password toggle */
    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      font-size: 16px;
      opacity: 0.6;
      transition: all var(--transition);
      z-index: 2;
      display: grid;
      place-items: center;
    }

    .toggle-password:hover {
      color: var(--text);
      opacity: 1;
    }

    .password-wrapper input {
      padding-right: 46px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: all var(--transition);
      cursor: pointer;
      white-space: nowrap;
      width: 100%;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 6px 18px rgba(88, 101, 242, .25);
      margin-top: 4px;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(88, 101, 242, .35);
    }

    .btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn i { font-size: 16px; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Auth footer */
    .auth-footer {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .auth-footer a {
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      transition: color var(--transition);
    }

    .auth-footer a:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    /* Theme toggle floating */
    .theme-toggle-float {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: all var(--transition);
    }

    .theme-toggle-float:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: scale(1.05);
    }

    /* Back to home link */
    .back-home {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: all var(--transition);
    }

    .back-home:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateX(-2px);
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 480px) {
      .auth-container { padding: 16px; }
      .auth-card { padding: 28px 22px 24px; border-radius: 18px; }
      .auth-logo .brand-mark { width: 46px; height: 46px; font-size: 21px; }
      .auth-logo h1 { font-size: 22px; }
      .back-home { top: 14px; left: 14px; padding: 6px 10px; font-size: 11px; }
      .theme-toggle-float { top: 14px; right: 14px; width: 36px; height: 36px; font-size: 18px; }
    }
    /* ============================================================
      DEMO CREDENTIALS BOX
      ============================================================ */
    .demo-box {
      margin-top: 20px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: var(--surface-2);
      overflow: hidden;
      transition: all var(--transition);
    }

    .demo-box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      transition: all var(--transition);
    }

    .demo-box-header:hover {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .demo-box-header i.bx-chevron-down,
    .demo-box-header i.bx-chevron-up {
      transition: transform var(--transition);
      font-size: 16px;
    }

    .demo-box.open .demo-box-header {
      color: var(--primary);
      border-bottom: 1px dashed var(--border);
    }

    .demo-box-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .demo-box.open .demo-box-body {
      max-height: 400px;
    }

    .demo-list {
      list-style: none;
      padding: 12px 16px 16px;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .demo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 12px;
      transition: all var(--transition);
    }

    .demo-item:hover {
      border-color: var(--primary);
      transform: translateX(2px);
    }

    .demo-email {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 11.5px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      flex: 1;
    }

    .demo-email i {
      font-size: 14px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .demo-fill-btn {
      flex-shrink: 0;
      padding: 4px 10px;
      border-radius: 7px;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid rgba(88, 101, 242, .18);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .demo-fill-btn:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      transform: scale(1.05);
    }

    .demo-fill-btn:active {
      transform: scale(0.95);
    }

    .demo-password-row {
      padding: 0 16px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
    }

    .demo-password-row code {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 11px;
      color: var(--text);
    }
  </style>
</head>
<body>

  <!-- ============ FLOATING BACKGROUND ORBS ============ -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- ============ BACK TO HOME ============ -->
  <a href="index.html" class="back-home">
    <i class="bx bx-arrow-back"></i> Back to home
  </a>

  <!-- ============ THEME TOGGLE ============ -->
  <button class="theme-toggle-float" id="themeToggle" title="Toggle theme">
    <i class="bx bx-moon" id="themeIcon"></i>
  </button>

  <!-- ============ AUTH CARD ============ -->
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="brand-mark">T</div>
        <h1>Task<span>Flow</span></h1>
        <p>Sign in to manage your tasks</p>
      </div>

      <div class="auth-status" id="authStatus"></div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper password-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">
          <span id="submitText">Sign In</span>
          <i class="fas fa-arrow-right" id="submitIcon"></i>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create one now</a>
      </div>
      <!-- ============ DEMO CREDENTIALS ============ -->
      <div class="demo-box" id="demoBox">
        <div class="demo-box-header" id="demoBoxHeader">
          <span>
            <i class="bx bx-key"></i> Demo Credentials
          </span>
          <i class="bx bx-chevron-down" id="demoChevron"></i>
        </div>

        <div class="demo-box-body">
          <ul class="demo-list">
            <li class="demo-item">
              <span class="demo-email">
                <i class="bx bx-user-circle"></i>jiayun@taskflow.com
              </span>
              <button type="button" class="demo-fill-btn" data-email="jiayun@taskflow.com">Use</button>
            </li>
            <li class="demo-item">
              <span class="demo-email">
                <i class="bx bx-user-circle"></i>sarahlee@taskflow.com
              </span>
              <button type="button" class="demo-fill-btn" data-email="sarahlee@taskflow.com">Use</button>
            </li>
            <li class="demo-item">
              <span class="demo-email">
                <i class="bx bx-user-circle"></i>johndoe@taskflow.com
              </span>
              <button type="button" class="demo-fill-btn" data-email="johndoe@taskflow.com">Use</button>
            </li>
            <li class="demo-item">
              <span class="demo-email">
                <i class="bx bx-user-circle"></i>cadenkim@taskflow.com
              </span>
              <button type="button" class="demo-fill-btn" data-email="cadenkim@taskflow.com">Use</button>
            </li>
            <li class="demo-item">
              <span class="demo-email">
                <i class="bx bx-user-circle"></i>leemeimei@taskflow.com
              </span>
              <button type="button" class="demo-fill-btn" data-email="leemeimei@taskflow.com">Use</button>
            </li>
          </ul>

          <div class="demo-password-row">
            <i class="bx bx-lock-alt"></i>
            <span>Password for all:</span>
            <code>password123</code>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ SUPABASE ============ -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    (function() {
      'use strict';

      // =====================================================
      // CONFIGURATION
      // =====================================================
      const SUPABASE_URL = "https://vjtxicimwuovikifkwyb.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_GKDi350FTcPpHWwXfMapTw_hk2-8qaH";

      // =====================================================
      // INIT SUPABASE
      // =====================================================
      const supabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
          auth: {
            persistSession: true,
            storageKey: 'supabase-auth',
            storage: window.localStorage,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );

      // =====================================================
      // DOM REFS
      // =====================================================
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const loginForm = document.getElementById('loginForm');
      const submitBtn = document.getElementById('submitBtn');
      const submitText = document.getElementById('submitText');
      const submitIcon = document.getElementById('submitIcon');
      const authStatus = document.getElementById('authStatus');
      // const togglePassword = document.getElementById('togglePassword');
      const eyeIcon = document.getElementById('eyeIcon');

      // =====================================================
      // THEME
      // =====================================================
      const THEME_KEY = 'taskflow.theme';
      const themeToggle = document.getElementById('themeToggle');
      const themeIcon = document.getElementById('themeIcon');

      function applyTheme(theme) {
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          themeIcon.className = 'bx bx-sun';
        } else {
          document.documentElement.removeAttribute('data-theme');
          themeIcon.className = 'bx bx-moon';
        }
      }

      function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        localStorage.setItem(THEME_KEY, next);
      }

      // =====================================================
      // UTILITIES
      // =====================================================
      function showStatus(message, type = 'info') {
        authStatus.textContent = message;
        authStatus.className = 'auth-status show ' + type;
      }

      function hideStatus() {
        authStatus.className = 'auth-status';
      }

      function setLoading(isLoading) {
        if (isLoading) {
          submitBtn.disabled = true;
          submitText.innerHTML = '<span class="spinner"></span> Signing in...';
          submitIcon.style.display = 'none';
        } else {
          submitBtn.disabled = false;
          submitText.textContent = 'Sign In';
          submitIcon.style.display = 'inline';
        }
      }

      // =====================================================
      // PASSWORD TOGGLE
      // =====================================================
      // togglePassword.addEventListener('click', function() {
      //   const isPassword = passwordInput.type === 'password';
      //   passwordInput.type = isPassword ? 'text' : 'password';
      // });

      // =====================================================
      // CHECK EXISTING SESSION
      // =====================================================
      async function checkExistingSession() {
        try {
          const { data: { session } } = await supabase.auth.getSession();
          if (session) {
            showStatus('✅ Already signed in. Redirecting...', 'success');
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 1200);
            return true;
          }
        } catch (err) {
          console.error('Session check error:', err);
        }
        return false;
      }

      // =====================================================
      // LOGIN HANDLER
      // =====================================================
      async function handleLogin(e) {
        e.preventDefault();
        hideStatus();

        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!email || !password) {
          showStatus('⚠️ Please enter both email and password', 'error');
          return;
        }
        if (!email.includes('@') || !email.includes('.')) {
          showStatus('⚠️ Please enter a valid email address', 'error');
          return;
        }
        if (password.length < 6) {
          showStatus('⚠️ Password must be at least 6 characters', 'error');
          return;
        }

        setLoading(true);

        try {
          const { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: password,
          });

          if (error) {
            if (error.message.includes('Invalid login credentials')) {
              showStatus('❌ Invalid email or password. Please try again.', 'error');
            } else if (error.message.includes('Email not confirmed')) {
              showStatus('✅ Signing in...', 'success');
              setTimeout(() => {
                window.location.href = 'dashboard.html';
              }, 1200);
              return;
            } else {
              showStatus('❌ ' + error.message, 'error');
            }
            setLoading(false);
            return;
          }

          showStatus('✅ Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1500);

        } catch (err) {
          console.error('Login error:', err);
          showStatus('❌ Network error. Please try again.', 'error');
          setLoading(false);
        }
      }

      // =====================================================
      // KEYBOARD SHORTCUTS
      // =====================================================
      document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          loginForm.dispatchEvent(new Event('submit'));
        }
        if (e.key === 'Escape') {
          hideStatus();
          document.activeElement?.blur();
        }
      });

      // =====================================================
      // DEMO CREDENTIALS BOX
      // =====================================================
      const demoBox = document.getElementById('demoBox');
      const demoBoxHeader = document.getElementById('demoBoxHeader');
      const demoChevron = document.getElementById('demoChevron');
      const DEMO_PASSWORD = 'password123';

      function toggleDemoBox() {
        const isOpen = demoBox.classList.toggle('open');
        demoChevron.className = isOpen ? 'bx bx-chevron-up' : 'bx bx-chevron-down';
      }

      function fillDemoCredentials(email) {
        emailInput.value = email;
        passwordInput.value = DEMO_PASSWORD;
        hideStatus();
        passwordInput.focus();
        // Move cursor to end of password
        const len = passwordInput.value.length;
        passwordInput.setSelectionRange?.(len, len);
      }

      demoBoxHeader.addEventListener('click', toggleDemoBox);

      // Wire up all "Use" buttons
      document.querySelectorAll('.demo-fill-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();               // don't toggle the box
          fillDemoCredentials(btn.dataset.email);
        });
      });

      async function init() {
        // Apply saved theme
        const savedTheme = localStorage.getItem(THEME_KEY);
        if (savedTheme) {
          applyTheme(savedTheme);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          applyTheme('dark');
        }

        // Theme toggle
        themeToggle.addEventListener('click', toggleTheme);

        // Form submit
        loginForm.addEventListener('submit', handleLogin);

        // Check session
        const hasSession = await checkExistingSession();
        if (hasSession) return;

        // Focus email
        emailInput.focus();

        console.log('✅ TaskFlow Login Page Initialized');
        console.log('🔌 Connected to Supabase:', SUPABASE_URL);
        console.log('📝 Press Ctrl+Enter to submit');
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>

</body>
</html>
