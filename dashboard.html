<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // Apply saved theme immediately to prevent flash
        (function() {
            try {
                var theme = localStorage.getItem('taskflow-theme');
                if (theme) document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { /* localStorage unavailable */ }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Dashboard-specific styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-box {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
        }

        .dashboard-calendar-layout {
            grid-template-columns: minmax(0, 1.4fr) minmax(280px, .8fr);
            padding: 18px;
            margin: 0;
        }
        .dashboard-calendar-layout .calendar-card,
        .dashboard-day-panel {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
        }
        .dashboard-calendar-layout .calendar-card {
            padding: 16px;
        }
        .dashboard-calendar-layout .calendar-toolbar {
            justify-content: space-between;
        }
        .dashboard-calendar-layout .calendar-title {
            flex: 1;
        }
        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            margin-bottom: 4px;
            color: var(--muted);
            font-size: 9px;
            text-align: center;
        }
        .dashboard-calendar .calendar-grid {
            border: 0;
            gap: 4px;
        }
        .dashboard-cal-cell {
            min-width: 0;
            min-height: 76px;
            padding: 6px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            text-align: left;
            font-size: 10px;
            overflow: hidden;
        }
        .dashboard-cal-cell:hover,
        .dashboard-cal-cell.selected {
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        .dashboard-cal-cell .cal-date {
            display: block;
            margin-bottom: 3px;
        }
        .dashboard-cal-cell .event-dot {
            margin-top: 3px;
            padding: 2px 4px;
            font-size: 8px;
        }
        .calendar-more {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 8px;
        }
        .dashboard-day-panel {
            min-height: 100%;
        }
        .dashboard-day-tasks {
            padding: 10px 14px;
        }
        .dashboard-task-row {
            cursor: default;
            margin-bottom: 8px;
        }
        .dashboard-task-row:last-child {
            margin-bottom: 0;
        }
        .productivity-overview {
            margin-bottom: 18px;
        }
        .productivity-index {
            color: var(--primary);
            font-family: "Plus Jakarta Sans";
            font-size: 22px;
        }
        .productivity-body {
            display: grid;
            grid-template-columns: 150px minmax(0, 1fr);
            align-items: center;
            gap: 24px;
            padding: 18px;
        }
        .productivity-chart {
            display: grid;
            place-items: center;
            width: 124px;
            height: 124px;
            margin: auto;
            border-radius: 50%;
            background: conic-gradient(var(--primary) var(--productivity), var(--surface-2) 0);
            position: relative;
        }
        .productivity-chart::after {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            background: var(--surface);
        }
        .productivity-chart-center {
            position: relative;
            z-index: 1;
            display: grid;
            text-align: center;
        }
        .productivity-chart-center strong {
            font-family: "Plus Jakarta Sans";
            font-size: 22px;
        }
        .productivity-chart-center span {
            color: var(--muted);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .08em;
        }
        .productivity-summary {
            min-width: 0;
        }
        .productivity-summary-head,
        .productivity-legend {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 11px;
        }
        .productivity-summary-head {
            margin-bottom: 8px;
            color: var(--muted);
        }
        .productivity-summary-head strong,
        .productivity-legend strong {
            color: var(--text);
        }
        .productivity-track {
            height: 9px;
            margin-bottom: 14px;
            border-radius: 99px;
            background: var(--surface-2);
            overflow: hidden;
        }
        .productivity-track span {
            display: block;
            height: 100%;
            border-radius: inherit;
            background: var(--primary);
        }
        .productivity-legend {
            margin-top: 7px;
            color: var(--muted);
        }
        .productivity-legend span {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }
        .productivity-legend i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
        }
        .productivity-legend i.remaining {
            background: var(--surface-2);
            border: 1px solid var(--border);
        }
        .dashboard-task-title {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }
        .dashboard-task-title .task-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .dashboard-task-title .task-title.done {
            color: var(--muted);
            text-decoration: line-through;
        }
        .schedule-check {
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            width: 20px;
            height: 20px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: #fff;
            font-size: 13px;
        }
        .schedule-check:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: var(--primary);
        }
        .schedule-check.completed {
            border-color: var(--green);
            background: var(--green);
        }
        @media (max-width: 600px) {
            .productivity-body {
                grid-template-columns: 1fr;
            }
        }
        .dashboard-timeline {
            min-height: 280px;
        }
        .dashboard-timeline-row {
            grid-template-columns: 220px minmax(400px, 1fr);
        }
        @media (max-width: 1100px) {
            .dashboard-calendar-layout {
                grid-template-columns: 1fr;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .modal-head h3 {
            font-family: "Plus Jakarta Sans";
            font-size: 20px;
            margin: 0;
        }

        .modal-body label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            margin-top: 14px;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-body input,
        .modal-body textarea,
        .modal-body select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface-2);
            color: var(--text);
            font-size: 14px;
            transition: all 0.2s;
            outline: none;
            font-family: inherit;
        }

        .modal-body input:focus,
        .modal-body textarea:focus,
        .modal-body select:focus {
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }

        .modal-body textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-body .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .modal-body .form-error {
            color: var(--red);
            font-size: 12px;
            margin-top: 12px;
            min-height: 20px;
            padding: 6px 0;
        }

        .modal-foot {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .modal-foot .btn {
            padding: 10px 20px;
            font-size: 13px;
        }

        .modal-foot .btn .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 12px 24px;
            border-radius: 12px;
            background: #202735;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 2000;
            max-width: 90%;
            text-align: center;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 600px) {
            .modal-box {
                padding: 20px;
                margin: 10px;
            }
            .modal-body .modal-grid {
                grid-template-columns: 1fr;
            }
            .modal-foot {
                flex-direction: column-reverse;
            }
            .modal-foot .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <!-- LEFT NAVIGATION -->
        <div id="navbar-container"></div>

        <!-- MAIN CONTENT -->
        <main class="main">
            <!-- TOPBAR -->
            <div id="topbar-container"></div>

            <!-- PAGE CONTENT -->
            <section class="content" id="app">
                <div id="pageContent">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                        <span>Loading dashboard...</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 1. Shared app logic -->
    <script src="app.js"></script>

    <!-- 2. Task Modal (reusable) -->
    <script src="taskModal.js"></script>

    <!-- 3. Dashboard logic -->
    <script src="dashboard.js"></script>

    <!-- 4. Initialize -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof initDashboard === 'function') {
                initDashboard();
            }
        });
    </script>
</body>
</html>
