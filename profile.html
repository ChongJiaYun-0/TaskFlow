<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // Apply saved theme IMMEDIATELY, before any CSS renders or the
        // page paints. This must run synchronously and as early as
        // possible - if it runs after DOMContentLoaded (as it did before,
        // inside each page's init function), the browser paints the
        // default light theme first, then flips to dark a moment later,
        // producing a visible flash on every navigation.
        (function() {
            try {
                var theme = localStorage.getItem('taskflow-theme');
                if (theme) document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { /* localStorage unavailable - fall back to default theme */ }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <link rel="stylesheet" href="styles.css">
    <!-- Chart.js for analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        /* ===== PROFILE PAGE STYLES ===== */
        .profile-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Profile Header */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 30px;
            padding: 30px;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .profile-avatar-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .profile-avatar-wrapper .avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #6875ff, #8d96ff);
            color: #fff;
            border: 4px solid var(--surface);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .1);
        }

        .profile-avatar-wrapper .avatar-edit-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--surface);
            background: var(--primary);
            color: #fff;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .profile-avatar-wrapper .avatar-edit-btn:hover {
            transform: scale(1.1);
            background: var(--primary-dark);
        }

        .profile-info h2 {
            font-family: "Plus Jakarta Sans";
            font-size: 24px;
            margin: 0 0 4px;
        }

        .profile-info p {
            color: var(--muted);
            margin: 0;
            font-size: 14px;
        }

        .profile-settings {
            overflow: hidden;
        }
        .profile-settings-body {
            padding: 22px;
        }
        .profile-detail-grid,
        .profile-edit-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .profile-detail-grid {
            margin-bottom: 22px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
        }
        .profile-detail {
            display: grid;
            gap: 5px;
            min-width: 0;
        }
        .profile-detail strong {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 12px;
        }
        .profile-edit-fields .form-Group {
            display: grid;
            gap: 6px;
        }
        .profile-edit-fields label {
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
        }
        .profile-edit-fields input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--surface-2);
            color: var(--text);
            outline: none;
            font-size: 12px;
        }
        .profile-edit-fields input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }
        .profile-settings-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 18px;
        }
        .profile-settings-message {
            min-height: 18px;
            margin: 14px 0 0;
            color: var(--muted);
            font-size: 11px;
        }
        .profile-settings-message.success { color: var(--green); }
        .profile-settings-message.error { color: var(--red); }

        .profile-info .profile-stats {
            display: flex;
            gap: 24px;
            margin-top: 12px;
        }

        .profile-info .profile-stats span {
            font-size: 13px;
            color: var(--muted);
        }

        .profile-info .profile-stats strong {
            color: var(--text);
            font-size: 16px;
            margin-right: 4px;
        }

        .profile-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Edit Form */
        .profile-edit-form {
            display: none;
            padding: 20px;
            background: var(--surface-2);
            border-radius: var(--radius);
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .profile-edit-form.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-edit-form .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .profile-edit-form .form-Group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .profile-edit-form .form-Group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .profile-edit-form .form-Group input {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            transition: all 0.2s ease;
            outline: none;
        }

        .profile-edit-form .form-Group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }

        .profile-edit-form .form-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            justify-content: flex-end;
        }

        /* Analytics Section */
        .analytics-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 24px;
        }

        .analytics-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }

        .analytics-card .card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .analytics-card .card-title .badge {
            font-size: 10px;
        }

        .chart-container {
            position: relative;
            height: 200px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 24px;
        }

        .stats-grid .stat-card {
            padding: 16px;
            text-align: center;
        }

        .stats-grid .stat-card .stat-number {
            font-size: 28px;
        }

        .stats-grid .stat-card .stat-label {
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px;
        }

        .stats-grid .stat-card .stat-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        /* Calendar Integration */
        .calendar-integration {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 24px;
        }

        .calendar-integration .integration-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .calendar-integration .integration-item:last-child {
            border-bottom: none;
        }

        .calendar-integration .integration-item .integration-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .calendar-integration .integration-item .integration-info i {
            font-size: 24px;
            color: var(--primary);
        }

        .calendar-integration .integration-item .integration-info .integration-name {
            font-weight: 600;
            font-size: 14px;
        }

        .calendar-integration .integration-item .integration-info .integration-desc {
            font-size: 12px;
            color: var(--muted);
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .toggle-switch.active {
            background: var(--primary);
        }

        .toggle-switch .toggle-slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: all 0.3s ease;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1);
        }

        .toggle-switch.active .toggle-slider {
            left: 22px;
        }

        /* Activity Timeline */
        .activity-timeline {
            padding: 10px 0;
        }

        .activity-item {
            display: flex;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            align-items: flex-start;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-item .activity-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary-soft);
            display: grid;
            place-items: center;
            color: var(--primary);
            flex-shrink: 0;
            font-size: 14px;
        }

        .activity-item .activity-content {
            flex: 1;
        }

        .activity-item .activity-content .activity-title {
            font-size: 13px;
            font-weight: 500;
        }

        .activity-item .activity-content .activity-time {
            font-size: 11px;
            color: var(--muted);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
                padding: 20px;
            }

            .profile-actions {
                margin-left: 0;
                width: 100%;
                justify-content: center;
            }

            .profile-info .profile-stats {
                justify-content: center;
            }

            .analytics-section {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .profile-edit-form .form-grid {
                grid-template-columns: 1fr;
            }

            .profile-detail-grid,
            .profile-edit-fields {
                grid-template-columns: 1fr;
            }

            .calendar-integration .integration-item {
                flex-wrap: wrap;
                gap: 8px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .profile-avatar-wrapper .avatar-large {
                width: 80px;
                height: 80px;
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <!-- LEFT NAVIGATION -->
        <div id="navbar-container"></div>

        <!-- MAIN CONTENT -->
        <main class="main">
            <!-- TOPBAR -->
            <div id="topbar-container"></div>

            <!-- PAGE CONTENT -->
            <section class="content" id="app">
                <div id="pageContent">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                        <span>Loading dashboard...</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- ============================================
         SCRIPTS - Load in order
         ============================================ -->
    <!-- 1. Shared app logic -->
    <script src="app.js"></script>
    
    <!-- 2. Task Modal (reusable) -->
    <script src="taskModal.js"></script>
    
    <!-- 3. Profile logic -->
    <script src="profile.js"></script>
    </script>

    <!-- Profile initialization -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof initProfile === 'function') {
                initProfile();
            }
        });
    </script>
</body>
</html>
